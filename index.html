<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harjyot Sohal</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/3xsXvWR.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --orange: #ff7a00;
        --orange-dim: rgba(255, 122, 0, 0.2);
        --orange-glow: rgba(255, 122, 0, 0.6);
        --bg: #050505;
        --card: #0c0c0c;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* ─── SCROLLBAR ─── */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #000;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--orange);
        border-radius: 2px;
      }

      body {
        background: var(--bg);
        color: #eee;
        font-family: "Inter", sans-serif;
        overflow-x: hidden;
      }

      /* ─── NOISE OVERLAY ─── */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 9997;
        opacity: 0.4;
      }

      /* ─── NAV ─── */
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 40px;
        border-bottom: 1px solid var(--orange-dim);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        background: rgba(5, 5, 5, 0.85);
        backdrop-filter: blur(12px);
        transition: padding 0.3s;
      }
      header.scrolled {
        padding: 12px 40px;
      }
      .logo {
        font-family: "Orbitron";
        color: var(--orange);
        font-size: 1.1rem;
        letter-spacing: 3px;
      }
      nav a {
        color: #aaa;
        margin-left: 28px;
        text-decoration: none;
        font-size: 0.85rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        position: relative;
        transition: color 0.3s;
      }
      nav a::after {
        content: "";
        position: absolute;
        bottom: -3px;
        left: 0;
        right: 0;
        height: 1px;
        background: var(--orange);
        transform: scaleX(0);
        transition: transform 0.3s;
        transform-origin: left;
      }
      nav a:hover {
        color: var(--orange);
      }
      nav a:hover::after {
        transform: scaleX(1);
      }

      /* ─── SCROLL PROGRESS ─── */
      #scroll-progress {
        position: fixed;
        top: 0;
        left: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--orange), #ffb347);
        z-index: 101;
        width: 0%;
        transition: width 0.1s;
        box-shadow: 0 0 8px var(--orange-glow);
      }

      /* ─── HERO ─── */
      .hero {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.88)),
          url("https://images.unsplash.com/photo-1481414981591-5732874c7193?q=80&w=1173&auto=format&fit=crop");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        position: relative;
        overflow: hidden;
      }
      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.04) 2px,
          rgba(0, 0, 0, 0.04) 4px
        );
        pointer-events: none;
        animation: scanMove 8s linear infinite;
      }
      @keyframes scanMove {
        from {
          background-position: 0 0;
        }
        to {
          background-position: 0 40px;
        }
      }

      .hero-box {
        background: rgba(0, 0, 0, 0.65);
        padding: 50px 48px;
        border-radius: 16px;
        max-width: 740px;
        width: 90%;
        backdrop-filter: blur(10px);
        border: 1px solid var(--orange-dim);
        box-shadow: 0 0 30px rgba(255, 122, 0, 0.15),
          inset 0 0 30px rgba(255, 122, 0, 0.04);
        animation: heroReveal 1.2s ease both;
        position: relative;
        z-index: 1;
      }
      @keyframes heroReveal {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .hero-cta {
        display: inline-block;
        margin-top: 28px;
        padding: 12px 32px;
        border: 1px solid var(--orange);
        color: var(--orange);
        text-decoration: none;
        font-family: "Orbitron";
        font-size: 0.75rem;
        letter-spacing: 3px;
        border-radius: 4px;
        transition: background 0.3s, color 0.3s, box-shadow 0.3s;
      }
      .hero-cta:hover {
        background: var(--orange);
        color: #000;
        box-shadow: 0 0 20px var(--orange-glow);
      }

      /* ─── GLITCH ─── */
      .glitch {
        position: relative;
        font-family: "Orbitron", sans-serif;
        font-size: 3.2rem;
        color: var(--orange);
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(255, 122, 0, 0.95),
          0 0 28px rgba(255, 122, 0, 0.7);
        animation: flicker 1.8s infinite, glitchPulse 6s infinite;
      }
      .glitch::before,
      .glitch::after {
        content: attr(data-text);
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        color: var(--orange);
        opacity: 0.35;
      }
      .glitch::before {
        animation: glitchShift 2s infinite;
      }
      .glitch::after {
        animation: glitchShift 2.4s infinite reverse;
      }
      @keyframes flicker {
        0%,
        16%,
        20%,
        24%,
        52%,
        56%,
        100% {
          opacity: 1;
        }
        18%,
        22%,
        54% {
          opacity: 0.8;
        }
      }
      @keyframes glitchShift {
        0% {
          transform: translateX(0);
        }
        15% {
          transform: translateX(-2px);
        }
        30% {
          transform: translateX(2px);
        }
        45% {
          transform: translateX(-1.5px);
        }
        60% {
          transform: translateX(1.5px);
        }
        75% {
          transform: translateX(-1px);
        }
        90% {
          transform: translateX(1px);
        }
        100% {
          transform: translateX(0);
        }
      }
      @keyframes glitchPulse {
        0%,
        92%,
        100% {
          letter-spacing: 2px;
        }
        94% {
          letter-spacing: 4px;
        }
        96% {
          letter-spacing: 1px;
        }
      }
      .hero-sub {
        color: var(--orange);
        margin-top: 12px;
        font-size: 1.1rem;
        text-shadow: 0 0 10px rgba(255, 122, 0, 0.5);
        animation: heroReveal 1.4s 0.2s ease both;
      }
      .hero-desc {
        color: #ccc;
        margin-top: 15px;
        line-height: 1.7;
        font-size: 0.95rem;
        animation: heroReveal 1.4s 0.4s ease both;
      }

      /* ─── SECTION BASE ─── */
      .section {
        max-width: 1100px;
        margin: auto;
        padding: 80px 24px;
      }
      .section-title {
        font-family: "Orbitron", sans-serif;
        font-size: 2.2rem;
        color: var(--orange);
        text-align: center;
        text-shadow: 0 0 10px rgba(255, 122, 0, 0.8),
          0 0 30px rgba(255, 122, 0, 0.5), 0 0 60px rgba(255, 122, 0, 0.3);
        margin-bottom: 40px;
      }

      /* ─── SCROLL REVEAL ─── */
      .reveal {
        opacity: 0;
        transform: translateY(40px);
        transition: opacity 0.7s ease, transform 0.7s ease;
      }
      .reveal.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .reveal-left {
        opacity: 0;
        transform: translateX(-50px);
        transition: opacity 0.8s ease, transform 0.8s ease;
      }
      .reveal-left.visible {
        opacity: 1;
        transform: translateX(0);
      }
      .reveal-right {
        opacity: 0;
        transform: translateX(50px);
        transition: opacity 0.8s ease, transform 0.8s ease;
      }
      .reveal-right.visible {
        opacity: 1;
        transform: translateX(0);
      }
      .reveal-scale {
        opacity: 0;
        transform: scale(0.85);
        transition: opacity 0.7s ease, transform 0.7s ease;
      }
      .reveal-scale.visible {
        opacity: 1;
        transform: scale(1);
      }
      .stagger > * {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 0.6s ease, transform 0.6s ease;
      }
      .stagger.visible > *:nth-child(1) {
        transition-delay: 0s;
        opacity: 1;
        transform: none;
      }
      .stagger.visible > *:nth-child(2) {
        transition-delay: 0.1s;
        opacity: 1;
        transform: none;
      }
      .stagger.visible > *:nth-child(3) {
        transition-delay: 0.2s;
        opacity: 1;
        transform: none;
      }
      .stagger.visible > *:nth-child(4) {
        transition-delay: 0.3s;
        opacity: 1;
        transform: none;
      }
      .stagger.visible > *:nth-child(5) {
        transition-delay: 0.4s;
        opacity: 1;
        transform: none;
      }
      .stagger.visible > *:nth-child(6) {
        transition-delay: 0.5s;
        opacity: 1;
        transform: none;
      }
      .stagger.visible > *:nth-child(7) {
        transition-delay: 0.6s;
        opacity: 1;
        transform: none;
      }
      .stagger.visible > *:nth-child(8) {
        transition-delay: 0.7s;
        opacity: 1;
        transform: none;
      }
      .stagger.visible > *:nth-child(9) {
        transition-delay: 0.8s;
        opacity: 1;
        transform: none;
      }

      /* ─── DIVIDER ─── */
      .divider {
        width: 100%;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--orange),
          transparent
        );
        margin: 0 auto;
        opacity: 0.4;
      }

      /* ─── ABOUT ─── */
      #about {
        padding-top: 100px;
      }
      .about-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 60px;
        align-items: center;
      }
      @media (max-width: 720px) {
        .about-grid {
          grid-template-columns: 1fr;
          gap: 40px;
        }
        .glitch {
          font-size: 2rem;
        }
      }

      .photo-frame {
        position: relative;
      }
      .photo-frame::before {
        content: "";
        position: absolute;
        inset: -8px;
        border: 1px solid var(--orange-dim);
        border-radius: 16px;
        transform: rotate(2deg);
        transition: transform 0.4s;
      }
      .photo-frame::after {
        content: "";
        position: absolute;
        inset: -16px;
        border: 1px solid rgba(255, 122, 0, 0.1);
        border-radius: 20px;
        transform: rotate(-1.5deg);
        transition: transform 0.4s;
      }
      .photo-frame:hover::before {
        transform: rotate(0deg);
      }
      .photo-frame:hover::after {
        transform: rotate(0deg);
      }
      .photo-img {
        width: 100%;
        aspect-ratio: 3/4;
        object-fit: cover;
        border-radius: 12px;
        border: 2px solid rgba(255, 122, 0, 0.3);
        filter: grayscale(20%) contrast(1.05);
        transition: filter 0.4s, box-shadow 0.4s;
        display: block;
        position: relative;
        z-index: 1;
      }
      .photo-frame:hover .photo-img {
        filter: grayscale(0%) contrast(1.1);
        box-shadow: 0 0 40px rgba(255, 122, 0, 0.3);
      }
      .photo-frame {
        will-change: transform;
      }

      .about-text h2 {
        font-family: "Orbitron";
        font-size: 1.8rem;
        color: var(--orange);
        margin-bottom: 20px;
        text-shadow: 0 0 12px rgba(255, 122, 0, 0.5);
      }
      .about-text p {
        color: #bbb;
        line-height: 1.8;
        margin-bottom: 16px;
        font-size: 0.95rem;
      }
      .skills-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 24px;
      }
      .skill-tag {
        padding: 6px 14px;
        border: 1px solid rgba(255, 122, 0, 0.35);
        border-radius: 4px;
        font-size: 0.78rem;
        color: rgba(255, 122, 0, 0.85);
        letter-spacing: 1px;
        background: rgba(255, 122, 0, 0.05);
        transition: background 0.3s, box-shadow 0.3s;
      }
      .skill-tag:hover {
        background: rgba(255, 122, 0, 0.12);
        box-shadow: 0 0 10px rgba(255, 122, 0, 0.3);
      }

      /* ─── STATS BAR ─── */
      .stats-strip {
        display: flex;
        justify-content: center;
        gap: 60px;
        padding: 48px 24px;
        background: rgba(255, 122, 0, 0.04);
        border-top: 1px solid var(--orange-dim);
        border-bottom: 1px solid var(--orange-dim);
      }
      .stat-item {
        text-align: center;
      }
      .stat-num {
        font-family: "Orbitron";
        font-size: 2.4rem;
        color: var(--orange);
        text-shadow: 0 0 14px var(--orange-glow);
        display: block;
      }
      .stat-label {
        font-size: 0.75rem;
        letter-spacing: 2px;
        color: #777;
        text-transform: uppercase;
        margin-top: 4px;
      }
      @media (max-width: 600px) {
        .stats-strip {
          gap: 30px;
          flex-wrap: wrap;
        }
        .stat-num {
          font-size: 1.8rem;
        }
      }

      /* ─── OWNERSBOX BANNER ─── */
      .ob-banner {
        max-width: 900px;
        margin: 0 auto 50px auto;
        padding: 28px 32px;
        text-align: center;
        color: #ccc;
        line-height: 1.7;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 122, 0, 0.25);
        border-radius: 12px;
        box-shadow: 0 0 25px rgba(255, 122, 0, 0.1);
        font-size: 0.93rem;
      }
      .ob-label {
        color: var(--orange);
        font-family: "Orbitron";
        letter-spacing: 2px;
        margin-bottom: 12px;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(255, 122, 0, 0.6);
        font-size: 0.85rem;
      }

      /* ─── GRID ─── */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 22px;
      }

      /* ─── VIDEO CARDS ─── */
      .video {
        border: 2px solid rgba(255, 122, 0, 0.2);
        border-radius: 12px;
        overflow: hidden;
        background: var(--card);
        transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s;
      }
      .video:hover {
        transform: scale(1.04) translateY(-4px);
        box-shadow: 0 12px 40px rgba(255, 122, 0, 0.5);
        border-color: var(--orange);
      }
      .video iframe {
        width: 100%;
        height: 200px;
        border: 0;
      }
      .video h3 {
        padding: 14px;
        color: var(--orange);
        font-size: 0.9rem;
        text-shadow: 0 0 10px rgba(255, 122, 0, 0.6);
      }

      /* ─── BRAND WORK SECTION ─── */
      #brand-work {
        background: rgba(255, 122, 0, 0.02);
        border-top: 1px solid var(--orange-dim);
        border-bottom: 1px solid var(--orange-dim);
        padding: 80px 0;
      }
      #brand-work .section {
        padding-top: 0;
        padding-bottom: 0;
      }

      /* Brand logos strip */
      .brand-logos {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 32px;
        flex-wrap: wrap;
        margin-bottom: 48px;
      }
      .brand-pill {
        padding: 8px 22px;
        border: 1px solid rgba(255, 122, 0, 0.4);
        border-radius: 100px;
        font-family: "Orbitron";
        font-size: 0.72rem;
        letter-spacing: 2px;
        color: rgba(255, 122, 0, 0.75);
        background: rgba(255, 122, 0, 0.06);
        text-transform: uppercase;
        transition: background 0.3s, box-shadow 0.3s, color 0.3s;
      }
      .brand-pill:hover {
        background: rgba(255, 122, 0, 0.14);
        box-shadow: 0 0 14px rgba(255, 122, 0, 0.35);
        color: var(--orange);
      }

      /* Brand blurb banner */
      .brand-blurb {
        max-width: 820px;
        margin: 0 auto 52px auto;
        padding: 26px 36px;
        text-align: center;
        color: #bbb;
        line-height: 1.75;
        font-size: 0.95rem;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 122, 0, 0.22);
        border-radius: 12px;
        box-shadow: 0 0 30px rgba(255, 122, 0, 0.08);
        position: relative;
        overflow: hidden;
      }
      .brand-blurb::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--orange),
          transparent
        );
        opacity: 0.6;
      }
      .brand-blurb strong {
        color: var(--orange);
        font-weight: 600;
      }

      /* Shorts grid — portrait aspect ratio */
      .shorts-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
      }
      @media (min-width: 900px) {
        .shorts-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      @media (max-width: 600px) {
        .shorts-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .short-card {
        border: 2px solid rgba(255, 122, 0, 0.22);
        border-radius: 12px;
        overflow: hidden;
        background: var(--card);
        transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s;
        aspect-ratio: 9/16;
        position: relative;
      }
      .short-card:hover {
        transform: scale(1.04) translateY(-4px);
        box-shadow: 0 12px 40px rgba(255, 122, 0, 0.5);
        border-color: var(--orange);
      }
      .short-card iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      /* Brand TikTok cards — same portrait style */
      .brand-tiktok-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-top: 24px;
      }
      @media (min-width: 900px) {
        .brand-tiktok-grid {
          grid-template-columns: repeat(3, minmax(0, 320px));
          justify-content: center;
        }
      }
      .brand-tiktok-card {
        border: 2px solid var(--orange);
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(255, 122, 0, 0.3);
        overflow: hidden;
        transition: transform 0.3s, box-shadow 0.3s;
        background: #000;
        aspect-ratio: 9/16;
      }
      .brand-tiktok-card:hover {
        transform: scale(1.04) translateY(-4px);
        box-shadow: 0 0 40px rgba(255, 122, 0, 0.7);
      }
      .brand-tiktok-card iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      /* Sub-label for brand subsections */
      .brand-sub-label {
        font-family: "Orbitron";
        font-size: 0.78rem;
        letter-spacing: 3px;
        color: rgba(255, 122, 0, 0.55);
        text-transform: uppercase;
        text-align: center;
        margin-bottom: 20px;
        margin-top: 44px;
      }
      .brand-sub-label:first-of-type {
        margin-top: 0;
      }

      /* ─── TIKTOK ─── */
      .tiktok-wrapper {
        border: 2px solid var(--orange);
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(255, 122, 0, 0.3);
        overflow: hidden;
        transition: transform 0.3s, box-shadow 0.3s;
        background: #000;
      }
      .tiktok-wrapper:hover {
        transform: scale(1.04) translateY(-4px);
        box-shadow: 0 0 40px rgba(255, 122, 0, 0.7);
      }

      /* ─── MOTION GRAPHICS iframes ─── */
      .hero-video {
        margin-top: 30px;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--orange-dim);
        box-shadow: 0 0 30px rgba(255, 122, 0, 0.15);
        transition: box-shadow 0.3s;
      }
      .hero-video:hover {
        box-shadow: 0 0 50px rgba(255, 122, 0, 0.35);
      }
      .hero-video iframe {
        display: block;
      }

      /* ─── CONTACT ─── */
      #contact {
        text-align: center;
      }
      .contact-card {
        display: inline-block;
        margin-top: 20px;
        padding: 32px 48px;
        border: 1px solid var(--orange-dim);
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(8px);
        box-shadow: 0 0 30px rgba(255, 122, 0, 0.1);
        transition: box-shadow 0.4s;
      }
      .contact-card:hover {
        box-shadow: 0 0 50px rgba(255, 122, 0, 0.25);
      }
      .contact-card p {
        font-family: "Orbitron";
        font-size: 1.1rem;
        color: var(--orange);
        text-shadow: 0 0 8px rgba(255, 122, 0, 0.7);
      }
      .contact-card a {
        color: var(--orange);
        text-decoration: none;
        transition: text-shadow 0.3s;
      }
      .contact-card a:hover {
        text-shadow: 0 0 16px var(--orange);
      }

      /* ─── FOOTER ─── */
      footer {
        text-align: center;
        padding: 32px;
        color: #555;
        border-top: 1px solid rgba(255, 122, 0, 0.08);
        font-size: 0.8rem;
        letter-spacing: 1px;
      }

      /* ─── SLOT MACHINE ─── */
      #slot-machine-wrap * {
        box-sizing: border-box;
      }
      #slot-machine-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 60px 1rem;
        background: rgba(255, 122, 0, 0.02);
        border-top: 1px solid var(--orange-dim);
        border-bottom: 1px solid var(--orange-dim);
      }
      #slot-machine-wrap .sm-machine {
        background: #111;
        border: 3px solid var(--orange);
        border-radius: 20px;
        padding: 30px 36px 36px;
        max-width: 460px;
        width: 100%;
        position: relative;
        box-shadow: 0 0 40px rgba(255, 122, 0, 0.25),
          0 0 80px rgba(255, 122, 0, 0.1);
      }
      #slot-machine-wrap .sm-title {
        font-family: "Orbitron", monospace;
        color: var(--orange);
        font-size: 1.1rem;
        text-align: center;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-bottom: 24px;
        text-shadow: 0 0 12px rgba(255, 122, 0, 0.8);
      }
      #slot-machine-wrap .sm-reels {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 24px;
        position: relative;
      }
      #slot-machine-wrap .sm-reel-window {
        width: 106px;
        height: 106px;
        background: #050505;
        border: 2px solid rgba(255, 122, 0, 0.5);
        border-radius: 12px;
        overflow: hidden;
        position: relative;
      }
      #slot-machine-wrap .sm-reel-window::before,
      #slot-machine-wrap .sm-reel-window::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 30px;
        z-index: 5;
        pointer-events: none;
      }
      #slot-machine-wrap .sm-reel-window::before {
        top: 0;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.85),
          transparent
        );
      }
      #slot-machine-wrap .sm-reel-window::after {
        bottom: 0;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
      }
      #slot-machine-wrap .sm-reel-track {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: absolute;
        width: 100%;
      }
      #slot-machine-wrap .sm-reel-item {
        width: 106px;
        height: 106px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 52px;
        flex-shrink: 0;
      }
      #slot-machine-wrap .sm-payline {
        position: absolute;
        top: 50%;
        left: -6px;
        right: -6px;
        height: 2px;
        background: rgba(255, 122, 0, 0.6);
        transform: translateY(-50%);
        z-index: 10;
        pointer-events: none;
      }
      #slot-machine-wrap .sm-payline.win {
        background: var(--orange);
        box-shadow: 0 0 12px rgba(255, 122, 0, 0.9);
        animation: smPaylinePulse 0.4s ease infinite alternate;
      }
      @keyframes smPaylinePulse {
        from {
          box-shadow: 0 0 8px rgba(255, 122, 0, 0.7);
        }
        to {
          box-shadow: 0 0 20px rgba(255, 122, 0, 1),
            0 0 40px rgba(255, 122, 0, 0.6);
        }
      }
      #slot-machine-wrap .sm-credits-row {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      #slot-machine-wrap .sm-credit-box {
        flex: 1;
        background: #0a0a0a;
        border: 1px solid rgba(255, 122, 0, 0.3);
        border-radius: 10px;
        padding: 10px 14px;
        text-align: center;
      }
      #slot-machine-wrap .sm-credit-label {
        font-size: 10px;
        letter-spacing: 2px;
        color: rgba(255, 122, 0, 0.6);
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      #slot-machine-wrap .sm-credit-value {
        font-family: "Orbitron", monospace;
        font-size: 1.3rem;
        color: var(--orange);
        text-shadow: 0 0 10px rgba(255, 122, 0, 0.7);
      }
      #slot-machine-wrap .sm-bet-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 20px;
      }
      #slot-machine-wrap .sm-bet-btn {
        background: transparent;
        border: 1px solid rgba(255, 122, 0, 0.4);
        color: var(--orange);
        border-radius: 8px;
        width: 36px;
        height: 36px;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #slot-machine-wrap .sm-bet-btn:hover {
        border-color: var(--orange);
        box-shadow: 0 0 8px rgba(255, 122, 0, 0.4);
      }
      #slot-machine-wrap .sm-bet-display {
        font-family: "Orbitron", monospace;
        color: var(--orange);
        font-size: 0.95rem;
        min-width: 90px;
        text-align: center;
      }
      #slot-machine-wrap .sm-spin-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #ff7a00, #e05500);
        border: none;
        border-radius: 12px;
        color: #fff;
        font-family: "Orbitron", monospace;
        font-size: 1rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 20px rgba(255, 122, 0, 0.4), 0 4px 0 #8b3d00;
      }
      #slot-machine-wrap .sm-spin-btn:not(:disabled):hover {
        box-shadow: 0 0 30px rgba(255, 122, 0, 0.7), 0 4px 0 #8b3d00;
      }
      #slot-machine-wrap .sm-spin-btn:not(:disabled):active {
        transform: translateY(2px);
        box-shadow: 0 0 20px rgba(255, 122, 0, 0.5), 0 2px 0 #8b3d00;
      }
      #slot-machine-wrap .sm-spin-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      #slot-machine-wrap .sm-message {
        text-align: center;
        margin-top: 18px;
        min-height: 28px;
        font-family: "Orbitron", monospace;
        font-size: 0.9rem;
        color: var(--orange);
        letter-spacing: 2px;
        text-shadow: 0 0 10px rgba(255, 122, 0, 0.6);
      }
      #slot-machine-wrap .sm-message.win-flash {
        animation: smWinPulse 0.5s ease infinite alternate;
      }
      @keyframes smWinPulse {
        from {
          text-shadow: 0 0 6px rgba(255, 122, 0, 0.6);
        }
        to {
          text-shadow: 0 0 20px rgba(255, 122, 0, 1),
            0 0 40px rgba(255, 122, 0, 0.8);
        }
      }
      #slot-machine-wrap .sm-paytable {
        margin-top: 20px;
        border-top: 1px solid rgba(255, 122, 0, 0.2);
        padding-top: 16px;
      }
      #slot-machine-wrap .sm-paytable-title {
        font-size: 10px;
        letter-spacing: 2px;
        color: rgba(255, 122, 0, 0.5);
        text-transform: uppercase;
        text-align: center;
        margin-bottom: 10px;
      }
      #slot-machine-wrap .sm-paytable-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
      }
      #slot-machine-wrap .sm-pay-entry {
        background: #0a0a0a;
        border: 1px solid rgba(255, 122, 0, 0.2);
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 12px;
        color: rgba(255, 122, 0, 0.7);
        white-space: nowrap;
      }
      #slot-machine-wrap .sm-confetti-wrap {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
        overflow: hidden;
        border-radius: 18px;
      }
      .sm-confetti-piece {
        position: absolute;
        width: 8px;
        height: 8px;
        opacity: 0;
        border-radius: 2px;
      }
      @keyframes smConfettiFall {
        0% {
          transform: translateY(-20px) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(280px) rotate(720deg);
          opacity: 0;
        }
      }

      /* ─── GRAPHIC DESIGN ─── */
      #graphic-design {
        background: rgba(255, 122, 0, 0.02);
        border-top: 1px solid var(--orange-dim);
        border-bottom: 1px solid var(--orange-dim);
        padding: 80px 0;
      }
      #graphic-design .section {
        padding-top: 0;
        padding-bottom: 0;
      }
      .gd-blurb {
        max-width: 820px;
        margin: 0 auto 52px auto;
        padding: 26px 36px;
        text-align: center;
        color: #bbb;
        line-height: 1.75;
        font-size: 0.95rem;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 122, 0, 0.22);
        border-radius: 12px;
        box-shadow: 0 0 30px rgba(255, 122, 0, 0.08);
        position: relative;
        overflow: hidden;
      }
      .gd-blurb::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--orange),
          transparent
        );
        opacity: 0.6;
      }
      .gd-blurb strong {
        color: var(--orange);
        font-weight: 600;
      }
      .gd-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
      }
      @media (max-width: 768px) {
        .gd-grid {
          grid-template-columns: 1fr;
        }
      }
      .gd-card {
        border: 2px solid rgba(255, 122, 0, 0.2);
        border-radius: 12px;
        overflow: hidden;
        background: var(--card);
        transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s;
        position: relative;
        cursor: pointer;
      }
      .gd-card:hover {
        transform: scale(1.03) translateY(-5px);
        box-shadow: 0 16px 48px rgba(255, 122, 0, 0.45);
        border-color: var(--orange);
      }
      .gd-card img {
        width: 100%;
        display: block;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        transition: filter 0.4s;
        filter: brightness(0.92) contrast(1.05);
      }
      .gd-card:hover img {
        filter: brightness(1) contrast(1.1);
      }
      .gd-card-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(255, 122, 0, 0.18) 0%,
          transparent 60%
        );
        opacity: 0;
        transition: opacity 0.3s;
      }
      .gd-card:hover .gd-card-overlay {
        opacity: 1;
      }
      /* Lightbox */
      #gd-lightbox {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.92);
        z-index: 9000;
        align-items: center;
        justify-content: center;
        cursor: zoom-out;
        backdrop-filter: blur(6px);
      }
      #gd-lightbox.active {
        display: flex;
      }
      #gd-lightbox img {
        max-width: 90vw;
        max-height: 88vh;
        border-radius: 10px;
        border: 1px solid rgba(255, 122, 0, 0.4);
        box-shadow: 0 0 60px rgba(255, 122, 0, 0.3);
        object-fit: contain;
      }
      #gd-lightbox-close {
        position: absolute;
        top: 24px;
        right: 32px;
        font-size: 2rem;
        color: var(--orange);
        cursor: pointer;
        line-height: 1;
        transition: text-shadow 0.2s;
      }
      #gd-lightbox-close:hover {
        text-shadow: 0 0 16px var(--orange);
      }

      /* ─── ANCHOR OFFSET (fixed header) ─── */
      section[id],
      div[id="slot-machine-wrap"],
      h2[id] {
        scroll-margin-top: 80px;
      }

      /* ─── NAV: DROPDOWNS ─── */
      nav {
        display: flex;
        align-items: center;
      }
      nav a.active {
        color: var(--orange);
      }
      nav a.active::after {
        transform: scaleX(1);
      }
      .nav-item {
        position: relative;
        margin-left: 28px;
      }
      .nav-item > a {
        margin-left: 0;
      }
      .nav-toggle {
        background: none;
        border: none;
        color: #aaa;
        font: inherit;
        font-size: 0.85rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0;
        transition: color 0.3s;
      }
      .nav-toggle .chev {
        display: inline-block;
        font-size: 0.6rem;
        transition: transform 0.3s;
      }
      .nav-item:hover .nav-toggle,
      .nav-item.open .nav-toggle,
      .nav-toggle.active {
        color: var(--orange);
      }
      .nav-item:hover .chev,
      .nav-item.open .chev {
        transform: rotate(180deg);
      }
      .dropdown {
        position: absolute;
        top: calc(100% + 18px);
        left: 50%;
        min-width: 230px;
        padding: 10px;
        background: rgba(10, 10, 10, 0.96);
        border: 1px solid var(--orange-dim);
        border-radius: 12px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6),
          0 0 30px rgba(255, 122, 0, 0.12);
        backdrop-filter: blur(14px);
        opacity: 0;
        visibility: hidden;
        transform: translate(-50%, -8px);
        transition: opacity 0.25s, transform 0.25s, visibility 0.25s;
      }
      /* invisible bridge so the menu doesn't close crossing the gap */
      .dropdown::before {
        content: "";
        position: absolute;
        top: -18px;
        left: 0;
        right: 0;
        height: 18px;
      }
      .nav-item:hover .dropdown,
      .nav-item.open .dropdown {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, 0);
      }
      .dropdown a {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 0.78rem;
        color: #bbb;
        transition: background 0.2s, color 0.2s, padding-left 0.2s;
      }
      .dropdown a::after {
        display: none;
      }
      .dropdown a:hover {
        background: rgba(255, 122, 0, 0.1);
        color: var(--orange);
        padding-left: 18px;
      }
      .dropdown .dd-icon {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        border: 1px solid var(--orange-dim);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
        flex-shrink: 0;
      }
      .dropdown .dd-text small {
        display: block;
        text-transform: none;
        letter-spacing: 0;
        color: #666;
        font-size: 0.7rem;
        margin-top: 2px;
      }

      /* ─── NAV: MOBILE ─── */
      .burger {
        display: none;
        background: none;
        border: 1px solid var(--orange-dim);
        border-radius: 8px;
        width: 40px;
        height: 40px;
        cursor: pointer;
        position: relative;
        z-index: 102;
      }
      .burger span {
        position: absolute;
        left: 10px;
        right: 10px;
        height: 2px;
        background: var(--orange);
        transition: transform 0.3s, opacity 0.3s, top 0.3s;
      }
      .burger span:nth-child(1) { top: 13px; }
      .burger span:nth-child(2) { top: 19px; }
      .burger span:nth-child(3) { top: 25px; }
      .burger.open span:nth-child(1) { top: 19px; transform: rotate(45deg); }
      .burger.open span:nth-child(2) { opacity: 0; }
      .burger.open span:nth-child(3) { top: 19px; transform: rotate(-45deg); }

      @media (max-width: 820px) {
        header,
        header.scrolled {
          padding: 14px 20px;
          /* backdrop-filter would make the fixed menu position relative to the header */
          backdrop-filter: none;
          background: rgba(5, 5, 5, 0.97);
        }
        .burger {
          display: block;
        }
        nav {
          position: fixed;
          top: 0;
          right: 0;
          bottom: 0;
          width: min(320px, 85vw);
          flex-direction: column;
          align-items: stretch;
          padding: 90px 24px 24px;
          background: rgba(8, 8, 8, 0.98);
          border-left: 1px solid var(--orange-dim);
          transform: translateX(100%);
          transition: transform 0.35s ease;
          overflow-y: auto;
        }
        nav.open {
          transform: translateX(0);
        }
        nav > a,
        .nav-item {
          margin: 0 0 6px 0;
        }
        nav > a,
        .nav-toggle {
          padding: 12px 4px;
          font-size: 0.95rem;
          width: 100%;
          justify-content: space-between;
        }
        nav a::after {
          display: none;
        }
        .dropdown {
          position: static;
          transform: none;
          opacity: 1;
          visibility: visible;
          display: none;
          box-shadow: none;
          background: rgba(255, 122, 0, 0.04);
          margin-top: 4px;
        }
        .dropdown::before {
          display: none;
        }
        .nav-item:hover .dropdown {
          transform: none;
        }
        .nav-item.open .dropdown {
          display: block;
          transform: none;
        }
        .nav-item:hover .chev {
          transform: none;
        }
        .nav-item.open .chev {
          transform: rotate(180deg);
        }
      }
      .nav-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 99;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s, visibility 0.3s;
      }
      .nav-backdrop.show {
        opacity: 1;
        visibility: visible;
      }

      /* ─── HERO EXTRAS ─── */
      .hero-roles {
        font-family: "Orbitron";
        color: #fff;
        font-size: 0.85rem;
        letter-spacing: 3px;
        margin-top: 18px;
        min-height: 1.4em;
        animation: heroReveal 1.4s 0.3s ease both;
      }
      .hero-roles .typed {
        color: var(--orange);
      }
      .hero-roles .caret {
        display: inline-block;
        width: 2px;
        height: 1em;
        background: var(--orange);
        margin-left: 4px;
        vertical-align: -2px;
        animation: caretBlink 0.9s steps(1) infinite;
      }
      @keyframes caretBlink {
        50% {
          opacity: 0;
        }
      }
      .hero-ctas {
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .hero-cta.ghost {
        border-color: rgba(255, 255, 255, 0.25);
        color: #ddd;
      }
      .hero-cta.ghost:hover {
        background: transparent;
        border-color: var(--orange);
        color: var(--orange);
      }
      .scroll-cue {
        position: absolute;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        width: 24px;
        height: 40px;
        border: 2px solid var(--orange-dim);
        border-radius: 14px;
        z-index: 2;
      }
      .scroll-cue::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 8px;
        width: 4px;
        height: 8px;
        margin-left: -2px;
        border-radius: 2px;
        background: var(--orange);
        animation: scrollCue 1.6s ease infinite;
      }
      @keyframes scrollCue {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(14px); opacity: 0; }
      }

      /* ─── BRAND MARQUEE ─── */
      .brand-marquee {
        overflow: hidden;
        margin-bottom: 48px;
        mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
      }
      .brand-marquee .brand-logos {
        flex-wrap: nowrap;
        width: max-content;
        margin-bottom: 0;
        animation: marquee 22s linear infinite;
      }
      .brand-marquee:hover .brand-logos {
        animation-play-state: paused;
      }
      @keyframes marquee {
        to {
          transform: translateX(-50%);
        }
      }

      /* ─── TABS ─── */
      .tabs {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 28px;
        flex-wrap: wrap;
      }
      .tab-btn {
        background: transparent;
        border: 1px solid var(--orange-dim);
        color: #aaa;
        padding: 9px 22px;
        border-radius: 100px;
        font-family: "Orbitron";
        font-size: 0.7rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.3s, color 0.3s, box-shadow 0.3s, border-color 0.3s;
      }
      .tab-btn:hover {
        color: var(--orange);
        border-color: var(--orange);
      }
      .tab-btn.active {
        background: var(--orange);
        border-color: var(--orange);
        color: #000;
        box-shadow: 0 0 18px var(--orange-glow);
      }
      .tab-panel {
        display: none;
      }
      .tab-panel.active {
        display: block;
        animation: panelIn 0.5s ease;
      }
      @keyframes panelIn {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: none; }
      }

      /* ─── SHOW MORE (collapsible grids) ─── */
      .collapsible {
        position: relative;
        max-height: 1250px;
        overflow: hidden;
        transition: max-height 0.8s ease;
      }
      .collapsible::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 160px;
        background: linear-gradient(transparent, var(--bg));
        pointer-events: none;
        transition: opacity 0.4s;
      }
      .collapsible.expanded {
        max-height: 9000px;
      }
      .collapsible.expanded::after {
        opacity: 0;
      }
      .show-more {
        display: block;
        margin: 26px auto 0;
      }

      /* ─── 3D TILT ─── */
      .tilt {
        transform-style: preserve-3d;
        will-change: transform;
      }

      /* ─── BACK TO TOP ─── */
      #to-top {
        position: fixed;
        right: 24px;
        bottom: 24px;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 1px solid var(--orange);
        background: rgba(5, 5, 5, 0.85);
        color: var(--orange);
        font-size: 1.1rem;
        cursor: pointer;
        z-index: 98;
        opacity: 0;
        visibility: hidden;
        transform: translateY(12px);
